<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .status-message {
      margin-top: 1em;
      text-align: center;
      font-weight: bold;
    }
    .status-message.success {
      color: #2fb179;
    }
    .status-message.error {
      color: #e76f6f;
    }
  </style>
</head>
<body>
  <main>
    <div class="content">
      <h1>Join the Dashboard</h1>
      <p>Create your account by filling in the form. You’ll be redirected to your dashboard upon success.</p>
    </div>
    <div class="signup">
      <div class="signup__log">
        <p><strong>&#127891; Create Account</strong> below.</p>
      </div>
      <form id="signup-form" class="signup__form">
        <input type="text" name="first-name" placeholder="First Name" required />
        <input type="text" name="last-name" placeholder="Last Name" required />
        <input type="email" name="email" placeholder="Email Address" required />
        <input type="password" name="password" placeholder="Password" required />
        <input type="submit" value="Sign Up" />
        <span class="terms-notice">By signing up, you agree to our <span>Terms and Services</span></span>
        <div id="status" class="status-message"></div>
      </form>
    </div>
  </main>
  <footer>
    <p class="attribution">. Coded by <strong>Vansh Angra</strong></p>
  </footer>
  <script>
    const form = document.getElementById('signup-form');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const result = await res.json();
      statusDiv.textContent = result.message;

      if (result.success) {
        statusDiv.className = 'status-message success';
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 2000);
      } else {
        statusDiv.className = 'status-message error';
      }
    });
  </script>
</body>
</html>
