<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login page for secure access to personalized dashboard and features.">
  <meta name="keywords" content="login, dashboard, secure access">
  <link rel="stylesheet" href="style.css">
  <title>Login page</title>
</head>
<body>
  <main>
    <div class="content">
      <h1>Welcome to my Login page</h1>
      <p>Try logging in using your email and password to access your account. Enjoy secure, easy access to your personalized dashboard and features.</p>
    </div>
    <div class="signup">
      <div class="signup__log">
        <p><strong>&#127891; Sign in</strong> to continue.</p>
      </div>
      <form action="/login" method="POST" class="signup__form">
        <input type="email" name="email" id="email" aria-label="Email Address" placeholder="Email Address" required>
        <input type="password" name="password" id="password" aria-label="Password" placeholder="Password" required>
        <input type="submit" value="Log In" aria-label="Submit">
        <span class="terms-notice">By logging in, you agree to our <span>Terms and Services</span></span>
      </form>
    </div>
  </main>
  <footer>
    <p class="attribution">
      . Coded by <strong>Vansh Angra</strong>
    </p>
  </footer>
  <script src="js.js"></script>
</body>
</html>
